services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cppdsa}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cppdsa}"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    restart: always
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cppdsa}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy

  grader:
    build:
      context: .
      dockerfile: src/grader/Dockerfile
    restart: always
    environment:
      PORT: 4100
      HOST: 0.0.0.0
      GRADER_SECRET: ${GRADER_SECRET:-dev-grader-secret}
      GRADER_CONCURRENCY: ${GRADER_CONCURRENCY:-2}
      GRADER_MEMORY_BUDGET_MB: ${GRADER_MEMORY_BUDGET_MB:-400}
      SANDBOX_UID_BASE: ${SANDBOX_UID_BASE:-2000000000}
    ports:
      - "127.0.0.1:4100:4100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    restart: always
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
